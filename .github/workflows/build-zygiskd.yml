name: Build ZygiskSU daemon (KernelSU SELinux context)

on:
  push:
    branches:
      - fix-release-build-4ecb4a9
    paths:
      - 'zygiskd/**'
      - 'module/**'
      - 'loader/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-zygiskd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platforms;android-33" \
            "build-tools;33.0.1" \
            "ndk;25.1.8937393"

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Build release module outputs
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/25.1.8937393"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          chmod +x ./gradlew
          ./gradlew :module:prepareModuleFilesRelease --no-daemon --stacktrace

      - name: Collect only the ARM daemon binaries
        run: |
          set -euo pipefail
          SRC="module/build/outputs/module/release/bin"
          test -f "$SRC/arm64-v8a/zygiskd"
          test -f "$SRC/armeabi-v7a/zygiskd"
          mkdir -p artifacts
          install -m 0755 "$SRC/arm64-v8a/zygiskd" artifacts/zygiskd64
          install -m 0755 "$SRC/armeabi-v7a/zygiskd" artifacts/zygiskd32
          (cd artifacts && sha256sum zygiskd64 zygiskd32 > SHA256SUMS)
          file artifacts/zygiskd64 artifacts/zygiskd32
          cat artifacts/SHA256SUMS

      - name: Upload ARM32 and ARM64 daemon artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zygiskd-ksu-context-fix
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
