name: Android Release Build

on:
  push:
    branches:
      - fix-release-build-4ecb4a9
  pull_request:
    branches:
      - fix-release-build-4ecb4a9
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build KernelSU Zygisk module
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-33" \
            "build-tools;33.0.1" \
            "ndk;25.1.8937393"

      - name: Add Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android,i686-linux-android,x86_64-linux-android

      - name: Verify build toolchains
        run: |
          java -version
          rustc --version
          cargo --version
          test -d "$ANDROID_HOME/ndk/25.1.8937393"
          git submodule status

      - name: Build Release ZIP
        run: ./gradlew --no-daemon --stacktrace :module:zipRelease

      - name: Upload Release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ZygiskNext-KSU-Fix-release
          path: module/build/outputs/release/*.zip
          if-no-files-found: error
          retention-days: 14
